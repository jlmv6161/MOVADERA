<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Movadera &middot; Acceso</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#F4F7F8;color:#16334A;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;border:1px solid #D8E2E7;border-radius:16px;padding:32px;
    max-width:370px;width:100%;box-shadow:0 12px 40px rgba(22,51,74,.10)}
  .mark{width:42px;height:42px;background:#137A6D;border-radius:11px;display:flex;align-items:center;
    justify-content:center;color:#fff;font-weight:800;font-size:18px;margin-bottom:16px}
  h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin-bottom:5px}
  .sub{color:#6B7C89;font-size:13px;margin-bottom:20px}
  label{display:block;font-size:11px;color:#6B7C89;margin:14px 0 5px;text-transform:uppercase;
    letter-spacing:.06em;font-weight:650}
  input[type=text],input[type=password]{width:100%;background:#F4F7F8;border:1px solid #D8E2E7;
    color:#16334A;border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit}
  input:focus{outline:2px solid #137A6D;outline-offset:-1px}
  .chk{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:13px;color:#6B7C89;
    cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400}
  button{width:100%;background:#137A6D;color:#fff;font-weight:650;border:none;border-radius:10px;
    padding:12px;font-size:15px;cursor:pointer;margin-top:12px;font-family:inherit}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#A63A2E;font-size:13px;margin-top:12px;display:none;text-align:center;font-weight:550}
  .foot{color:#8FA0AC;font-size:11px;margin-top:18px;text-align:center;line-height:1.6}
  @media (prefers-color-scheme: dark){
    body{background:#0E1A23;color:#E7EEF2}
    .box{background:#16262F;border-color:#294050;box-shadow:0 12px 40px rgba(0,0,0,.5)}
    .sub,.chk,label{color:#A6B9C4}
    input[type=text],input[type=password]{background:#0E1A23;border-color:#294050;color:#E7EEF2}
    button{background:#45B8A5;color:#08211D}
    .foot{color:#718997}
  }
</style>
</head>
<body>
<div class="box">
  <div class="mark">M</div>
  <h1>Movadera</h1>
  <div class="sub">Estado de resultados &middot; acceso privado</div>
  <label for="u">Usuario</label>
  <input type="text" id="u" autocomplete="username" autocapitalize="none" spellcheck="false">
  <label for="p">Contrase&ntilde;a</label>
  <input type="password" id="p" autocomplete="current-password">
  <label class="chk"><input type="checkbox" id="rec"> Recordarme en este dispositivo</label>
  <button id="btn" onclick="entrar()">Entrar</button>
  <div class="err" id="err">Usuario o contrase&ntilde;a incorrectos</div>
  <div class="foot">El contenido est&aacute; cifrado dentro de este mismo archivo.<br>Sin la clave no se puede leer.</div>
</div>

var STOREKEY='movadera_fin_auth';
async function descifrar(u,p){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:150000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:IV},key,CT);
  var text=new TextDecoder().decode(pt);
  if(text.indexOf('<!--OK-->')!==0) throw new Error('bad');
  return text.slice(9);
}
async function entrar(){
  var u=document.getElementById('u').value, p=document.getElementById('p').value;
  var btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Verificando...';
  try{
    var html=await descifrar(u,p);
    var store=document.getElementById('rec').checked?localStorage:sessionStorage;
    try{store.setItem(STOREKEY,JSON.stringify({u:u,p:p}));}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('err').style.display='block';
    btn.disabled=false; btn.textContent='Entrar';
  }
}
document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')entrar();});
document.getElementById('u').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('p').focus();});
(async function(){
  var saved=null;
  try{saved=JSON.parse(sessionStorage.getItem(STOREKEY)||localStorage.getItem(STOREKEY));}catch(e){}
  if(saved&&saved.u!=null){
    try{var html=await descifrar(saved.u,saved.p);document.open();document.write(html);document.close();}
    catch(e){try{sessionStorage.removeItem(STOREKEY);localStorage.removeItem(STOREKEY);}catch(_){}}
  }
})();
</script>
